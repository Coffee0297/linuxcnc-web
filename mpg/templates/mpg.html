<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MPG pendant</title>
<link rel="stylesheet" href="{{ url_for('mpg.static', filename='mpg.css') }}">
</head>
<body>
<main id="app">

  <header class="strip">
    <span id="stateBadge" class="badge">…</span>
    <span id="simBadge" class="badge sim" hidden title="Built-in simulator: nothing you do here reaches a machine">SIMULATOR</span>
    <span class="spacer"></span>
    <span id="connDot" class="conn" title="connection"></span>
    <button id="abortBtn" class="abort" type="button">Abort</button>
  </header>

  <section class="dro" id="dro">
    <!-- rows injected by mpg.js: one per axis, tap to select -->
  </section>
  <div class="dro-foot">
    <button id="coordBtn" class="chip" type="button">work</button>
    <span id="leadNote" class="lead-note"></span>
  </div>

  <nav class="seg mode-seg" id="modeSeg">
    <button data-mode="mpg" class="on" type="button">Wheel</button>
    <button data-mode="jog" type="button">Jog</button>
  </nav>

  <section id="mpgPane" class="pane">
    <div class="seg" id="stepSeg">
      <button data-step="0.001" type="button">0.001</button>
      <button data-step="0.01" type="button">0.01</button>
      <button data-step="0.1" class="on" type="button">0.1</button>
      <button data-step="1.0" type="button">1.0</button>
    </div>
    <div class="wheel-wrap" id="wheelWrap">
      <svg id="wheelSvg" viewBox="0 0 320 320" aria-label="handwheel">
        <defs>
          <radialGradient id="face" cx="42%" cy="38%" r="72%">
            <stop offset="0%"  stop-color="#3a3d42"/>
            <stop offset="55%" stop-color="#26282c"/>
            <stop offset="100%" stop-color="#141518"/>
          </radialGradient>
          <radialGradient id="dimple" cx="40%" cy="35%" r="80%">
            <stop offset="0%"  stop-color="#54585f"/>
            <stop offset="100%" stop-color="#1a1b1e"/>
          </radialGradient>
        </defs>
        <circle cx="160" cy="160" r="156" fill="#0c0d0f"/>
        <circle id="knurl" cx="160" cy="160" r="148" fill="none"
                stroke="#3c3f44" stroke-width="14"
                stroke-dasharray="3 5.65"/>
        <g id="wheelRotor">
          <circle cx="160" cy="160" r="132" fill="url(#face)"
                  stroke="#000" stroke-width="2"/>
          <g id="ticks"></g>
          <circle cx="160" cy="160" r="30" fill="#101114"
                  stroke="#000" stroke-width="2"/>
          <circle id="grip" cx="160" cy="72" r="22" fill="url(#dimple)"
                  stroke="#000" stroke-width="2"/>
        </g>
        <polygon points="160,6 153,22 167,22" fill="var(--amber)"/>
      </svg>
      <div class="wheel-hint" id="wheelHint">machine off</div>
    </div>
  </section>

  <section id="jogPane" class="pane" hidden>
    <div class="seg" id="speedSeg">
      <button data-speed="100" type="button">100</button>
      <button data-speed="600" class="on" type="button">600</button>
      <button data-speed="3000" type="button">3000</button>
      <span class="seg-unit" data-unit="per-min">mm/min</span>
    </div>
    <div class="jog-buttons">
      <!-- X/Y cross, Z pair on the right; each arrow carries its own axis and direction -->
      <button id="jogYp" class="jog-btn" data-axis="y" data-dir="1"  type="button"><span class="arrow">&#9650;</span><span class="lbl">Y+</span></button>
      <button id="jogXm" class="jog-btn" data-axis="x" data-dir="-1" type="button"><span class="arrow">&#9664;</span><span class="lbl">X&minus;</span></button>
      <button id="jogXp" class="jog-btn" data-axis="x" data-dir="1"  type="button"><span class="arrow">&#9654;</span><span class="lbl">X+</span></button>
      <button id="jogYm" class="jog-btn" data-axis="y" data-dir="-1" type="button"><span class="arrow">&#9660;</span><span class="lbl">Y&minus;</span></button>
      <button id="jogZp" class="jog-btn" data-axis="z" data-dir="1"  type="button"><span class="arrow">&#9650;</span><span class="lbl">Z+</span></button>
      <button id="jogZm" class="jog-btn" data-axis="z" data-dir="-1" type="button"><span class="arrow">&#9660;</span><span class="lbl">Z&minus;</span></button>
    </div>
    <p class="jog-note" id="jogNote">Hold an arrow to move that axis. Release stops.</p>
  </section>

  <footer class="actions">
    <button id="homeBtn" class="act" type="button">Home X</button>
    <button id="homeAllBtn" class="act" type="button">Home all</button>
    <button id="powerBtn" class="act" type="button">Machine on</button>
    <button id="zeroBtn" class="act" type="button">Zero X</button>
    <button id="zeroHalfBtn" class="act" type="button">Zero X &half;&Oslash;</button>
    <button id="vibeBtn" class="act" type="button">Vibration on</button>
  </footer>

  <div id="halfDlg" class="overlay" hidden>
    <div class="dialog">
      <h2 id="halfTitle" class="dlg-title">Zero X at edge (&half; tool &Oslash;)</h2>
      <p id="halfTool" class="dlg-tool"></p>
      <button id="halfUseTool" class="chip dlg-usetool" type="button">Use tool table &Oslash;</button>
      <label class="dlg-label" for="halfDia">Tool diameter (<span data-unit>mm</span>)</label>
      <input id="halfDia" class="dlg-input" type="number" inputmode="decimal"
             min="0" step="0.001" placeholder="6.000">
      <p id="halfErr" class="dlg-err" hidden>Enter a diameter above 0</p>
      <p class="dlg-hint">Touching the part from the &minus; side &rarr; &minus;&half;&Oslash;</p>
      <div class="dlg-sides">
        <button id="halfMinus" class="dlg-side" type="button">Set X = &minus;&half;&Oslash;</button>
        <button id="halfPlus" class="dlg-side" type="button">Set X = +&half;&Oslash;</button>
      </div>
      <button id="halfCancel" class="chip dlg-cancel" type="button">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="lockOverlay" class="lock" hidden>
    <div>reconnecting&hellip;</div>
  </div>
</main>
<script src="{{ url_for('mpg.static', filename='mpg.js') }}"></script>
</body>
</html>
